<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gipfelbuch am Gedrechter</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f4f7f6; 
            color: #333; 
        }
        h1 { text-align: center; color: #2c3e50; }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }
        .info-box {
            background-color: #e8f4f8;
            border-left: 4px solid #2980b9;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            font-size: 0.9em;
            color: #2c3e50;
        }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea, button { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        .captcha-box {
            background: #eef2f5;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            border: 1px dashed #7f8c8d;
        }
        
        button { 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            font-weight: bold; 
            margin-top: 15px; 
            cursor: pointer; 
            transition: background-color 0.3s ease;
        }
        button:hover { background-color: #219150; }

        button:disabled, button.btn-disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            text-align: center;
        }
        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .eintrag { border-bottom: 1px solid #eee; padding: 10px 0; }
        .eintrag-header { font-weight: bold; color: #2c3e50; }
        .eintrag-datum { font-size: 0.8em; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Mein Eintrag ins Gipfelbuch</h2>
        
        <!-- Aktualisierte Info-Box mit automatischem Datums-Hinweis -->
        <div class="info-box">
            ℹ️ <strong>Hinweis:</strong> Jeder Eintrag wird vom Wintersportverein Kaltenbach-Ried geprüft und anschließend freigeschaltet. Datum und Uhrzeit werden vollautomatisch ergänzt.
        </div>

        <form id="gipfelForm">
            <label for="name">Dein Name / Team:</label>
            <input type="text" id="name" name="name" placeholder="z. B. Anna & Lukas" required>

            <label for="nachricht">Deine Nachricht:</label>
            <textarea id="nachricht" name="nachricht" rows="4" placeholder="Wetter, Aussicht, Tour..."></textarea>

            <div class="captcha-box">
                <label id="captchaLabel" for="captchaInput">Sicherheitsfrage:</label>
                <input type="number" id="captchaInput" placeholder="Antwort eingeben" required>
            </div>

            <button type="submit" id="submitBtn">Eintrag speichern</button>
            
            <div id="statusBox" class="status-message"></div>
        </form>
    </div>

    <div class="card">
        <h2>Bisherige Einträge</h2>
        <div id="eintraegeListe">Lade Einträge...</div>
    </div>

    <script>
        let num1 = 0;
        let num2 = 0;

        function erstelleCaptcha() {
            num1 = Math.floor(Math.random() * 9) + 1;
            num2 = Math.floor(Math.random() * 9) + 1;
            document.getElementById('captchaLabel').innerText = `Sicherheitsfrage: Was ist ${num1} + ${num2}?`;
            document.getElementById('captchaInput').value = '';
        }

        async function ladeEintraege() {
            try {
                const res = await fetch('/api/eintraege');
                const eintraege = await res.json();
                const liste = document.getElementById('eintraegeListe');
                
                if (eintraege.length === 0) {
                    liste.innerHTML = '<p>Noch keine Einträge vorhanden. Sei der Erste!</p>';
                    return;
                }

                liste.innerHTML = eintraege.map(e => `
                    <div class="eintrag">
                        <div class="eintrag-header">${escapeHtml(e.name)}</div>
                        <div class="eintrag-datum">${new Date(e.datum).toLocaleString('de-DE')}</div>
                        <p>${escapeHtml(e.nachricht || '')}</p>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('eintraegeListe').innerText = 'Fehler beim Laden der Einträge.';
            }
        }

        document.getElementById('gipfelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const name = document.getElementById('name').value;
            const nachricht = document.getElementById('nachricht').value;
            const captchaAnswer = document.getElementById('captchaInput').value;
            const expectedSum = num1 + num2;

            submitBtn.disabled = true;
            submitBtn.classList.add('btn-disabled');
            submitBtn.innerText = 'Wird gesendet...';
            
            statusBox.style.display = 'none';
            statusBox.className = 'status-message';

            try {
                const res = await fetch('/api/eintraege', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: name, 
                        nachricht: nachricht, 
                        captchaAnswer: parseInt(captchaAnswer, 10), 
                        captchaExpected: parseInt(expectedSum, 10) 
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('name').value = '';
                    document.getElementById('nachricht').value = '';
                    
                    // Aktualisierte Bestätigungsmeldung
                    statusBox.innerText = '✅ Vielen Dank! Dein Eintrag wurde abgesendet, wird vom Wintersportverein geprüft und anschließend freigeschaltet.';
                    statusBox.classList.add('status-success');
                    statusBox.style.display = 'block';

                    erstelleCaptcha();
                    ladeEintraege();
                } else {
                    statusBox.innerText = '❌ Fehler: ' + (data.error || 'Eintrag konnte nicht gespeichert werden.');
                    statusBox.classList.add('status-error');
                    statusBox.style.display = 'block';
                    
                    erstelleCaptcha();
                }
            } catch (err) {
                statusBox.innerText = '❌ Netzwerkfehler beim Speichern. Bitte versuche es später erneut.';
                statusBox.classList.add('status-error');
                statusBox.style.display = 'block';
            } finally {
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-disabled');
                    submitBtn.innerText = 'Eintrag speichern';
                }, 6000);
            }
        });

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        erstelleCaptcha();
        ladeEintraege();
    </script>
</body>
</html>
