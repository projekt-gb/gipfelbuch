<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitales Gipfelbuch</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #27ae60; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background-color: #219150; }
        .eintrag { border-bottom: 1px solid #eee; padding: 10px 0; }
        .eintrag-header { font-weight: bold; color: #2c3e50; }
        .eintrag-datum { font-size: 0.8em; color: #7f8c8d; }
    </style>
</head>
<body>

    <h1>🏔️ Gipfelbuch</h1>

    <div class="card">
        <h2>Ins Gipfelbuch eintragen</h2>
        <form id="gipfelForm">
            <label for="berg">Gipfel / Berg:</label>
            <input type="text" id="berg" name="berg" required readonly>

            <label for="name">Dein Name / Team:</label>
            <input type="text" id="name" name="name" placeholder="z. B. Anna & Lukas" required>

            <label for="nachricht">Deine Nachricht:</label>
            <textarea id="nachricht" name="nachricht" rows="4" placeholder="Wetter, Aussicht, Tour..."></textarea>

            <button type="submit">Eintrag speichern</button>
        </form>
    </div>

    <div class="card">
        <h2>Bisherige Einträge</h2>
        <div id="eintraegeListe">Lade Einträge...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const bergParam = urlParams.get('berg') || 'Unbekannter Gipfel';
        document.getElementById('berg').value = bergParam;

        async function ladeEintraege() {
            try {
                const response = await fetch(`/api/eintraege?berg=${encodeURIComponent(bergParam)}`);
                const eintraege = await response.json();
                const liste = document.getElementById('eintraegeListe');
                liste.innerHTML = '';

                if (eintraege.length === 0) {
                    liste.innerHTML = '<p>Noch keine Einträge für diesen Gipfel.</p>';
                    return;
                }

                eintraege.forEach(e => {
                    const div = document.createElement('div');
                    div.className = 'eintrag';
                    const datum = new Date(e.datum).toLocaleString('de-DE');
                    div.innerHTML = `
                        <div class="eintrag-header">${escapeHtml(e.name)}</div>
                        <div class="eintrag-datum">${datum}</div>
                        <p>${escapeHtml(e.nachricht || '')}</p>
                    `;
                    liste.appendChild(div);
                });
            } catch (err) {
                console.error('Fehler beim Laden:', err);
            }
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        document.getElementById('gipfelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const berg = document.getElementById('berg').value;
            const nachricht = document.getElementById('nachricht').value;

            try {
                const response = await fetch('/api/eintraege', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, berg, nachricht })
                });

                if (response.ok) {
                    document.getElementById('nachricht').value = '';
                    document.getElementById('name').value = '';
                    ladeEintraege();
                }
            } catch (err) {
                console.error('Fehler beim Speichern:', err);
            }
        });

        ladeEintraege();
    </script>
</body>
</html>
