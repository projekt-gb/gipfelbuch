<script>
        document.getElementById('loginBtn').addEventListener('click', ladeAdminEintraege);

        async function ladeAdminEintraege() {
            const pwInput = document.getElementById('pw');
            const password = pwInput.value.trim();
            const liste = document.getElementById('liste');

            if (!password) {
                alert('Bitte gib zuerst das Admin-Passwort ein.');
                return;
            }

            liste.innerHTML = '<div class="card"><p>Lade Daten vom Server...</p></div>';

            try {
                const res = await fetch('/api/admin/eintraege', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                // Prüfen, ob das Passwort falsch ist
                if (res.status === 401) {
                    alert('Falsches Passwort!');
                    liste.innerHTML = '<div class="card" style="color: red;"><p>❌ Falsches Admin-Passwort eingegeben.</p></div>';
                    return;
                }

                // Prüfen, ob der Server einen anderen Fehler meldet
                if (!res.ok) {
                    const errorText = await res.text();
                    liste.innerHTML = `<div class="card" style="color: red;"><p>❌ Server-Fehler (Status ${res.status}): ${errorText}</p></div>`;
                    return;
                }

                const eintraege = await res.json();

                if (!Array.isArray(eintraege)) {
                    liste.innerHTML = '<div class="card" style="color: red;"><p>❌ Unerwartetes Datenformat vom Server erhalten.</p></div>';
                    return;
                }

                if (eintraege.length === 0) {
                    liste.innerHTML = '<div class="card"><p>Keine Einträge in der Datenbank vorhanden.</p></div>';
                    return;
                }

                // Einträge erfolgreich rendern
                liste.innerHTML = eintraege.map(e => `
                    <div class="card">
                        <span class="badge ${e.freigegeben ? 'badge-approved' : 'badge-pending'}">
                            ${e.freigegeben ? 'Öffentlich' : 'Ausstehend'}
                        </span>
                        <h3>${escapeHtml(e.name)}</h3>
                        <p>${escapeHtml(e.nachricht || '')}</p>
                        <small>${new Date(e.datum).toLocaleString('de-DE')}</small><br><br>
                        ${!e.freigegeben ? `<button class="btn-ok" onclick="freischalten('${e._id}')">Freigeben</button>` : ''}
                        <button class="btn-del" onclick="loeschen('${e._id}')">Löschen</button>
                    </div>
                `).join('');

            } catch (err) {
                // Netzwerk- oder Verbindungsfehler abfangen
                console.error("Fetch-Fehler:", err);
                liste.innerHTML = `<div class="card" style="color: red;"><p>❌ Netzwerkfehler: Konnte keine Verbindung zum Server herstellen.<br><small>${err.message}</small></p></div>`;
            }
        }

        async function freischalten(id) {
            const password = document.getElementById('pw').value.trim();
            try {
                const res = await fetch('/api/admin/freischalten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, id })
                });
                if (res.ok) {
                    ladeAdminEintraege();
                } else {
                    alert('Fehler beim Freischalten.');
                }
            } catch (err) {
                alert('Netzwerkfehler.');
            }
        }

        async function loeschen(id) {
            if (!confirm('Möchtest du diesen Eintrag wirklich dauerhaft löschen?')) return;
            const password = document.getElementById('pw').value.trim();
            try {
                const res = await fetch('/api/admin/loeschen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, id })
                });
                if (res.ok) {
                    ladeAdminEintraege();
                } else {
                    alert('Fehler beim Löschen.');
                }
            } catch (err) {
                alert('Netzwerkfehler.');
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
